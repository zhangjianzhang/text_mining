}

/* The words and their statistical roles. */

/* Exact quantities remain labelled even when colour carries meaning. */
.chart { width: 100%; min-width: 0; margin: 18px 0; }

.bar-label { font-size: .9em; line-height: 1.45; overflow-wrap: anywhere; }

.bar-row.selected .bar-label, .bar-row.selected .bar-value { color: var(--accent); font-weight: 700; }

.chart-caption { margin-top: 10px; color: var(--muted); font-size: var(--small-size); line-height: 1.65; }
.probability-strip { display: flex; width: 100%; min-height: 56px; overflow: hidden; border: 1px solid var(--control-border); border-radius: var(--token-radius); }
.probability-strip > * { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; padding: 5px 3px; font-family: var(--mono); font-size: .82em; }
.plot { display: block; width: 100%; height: auto; overflow: visible; }
.plot text { fill: var(--muted); font-family: var(--sans); }
.plot .axis { stroke: var(--control-border); }

.table-wrap { width: 100%; max-width: 100%; margin: 18px 0; overflow-x: auto; border: 1px solid var(--divider); border-radius: calc(var(--radius) / 2); -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; color: var(--ink); background: var(--surface); font-size: .9em; line-height: 1.5; }
.data-table th, .data-table td { padding: 11px 12px; border-bottom: 1px solid var(--divider); text-align: right; vertical-align: middle; white-space: nowrap; }
.data-table th { font-weight: 650; color: var(--muted); background: var(--page); }

.data-table tr.selected td, .data-table tr.active td, .data-table td.selected { color: var(--accent); background: var(--soft); font-weight: 650; }

.nt-stages .nt-ready{color:var(--accent);border-color:var(--accent);font-weight:650}
.nt-order{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.nt-order span{padding:7px 11px;border:1px solid var(--divider);border-radius:4px;min-width:44px;text-align:center;font-size:16px}
.nt-order .nt-current{background:var(--soft);border:2px solid var(--accent);font-weight:700}
.nt-order .nt-used{background:var(--page);color:var(--muted)}
.nt-details{margin:22px 0;border-top:1px solid var(--divider);padding-top:12px;min-width:0}
.nt-details summary{cursor:pointer;min-height:44px;padding:6px 0;font-weight:600}
.nt-fieldset{border:0;border-top:1px solid var(--divider);padding:16px 0;margin:20px 0;min-width:0}
.nt-fieldset legend{padding:0 12px 0 0;font-weight:600}
.nt-fieldset:disabled{opacity:.7}
@media(max-width:480px){.nt-plot svg{min-width:390px}.nt-square svg{min-width:320px}.nt-stages{gap:8px 18px}.nt-order span{font-size:15px}}
.app[data-projector="true"] .nt-legend,.app[data-projector="true"] .nt-order span{font-size:19px}

.nl-pipeline{display:flex;gap:14px;list-style:none;padding:0;margin:24px 0;overflow-x:auto;counter-reset:nl-step}
.nl-pipeline li{flex:1;min-width:155px;border-top:3px solid var(--accent);padding:13px 14px 12px;background:var(--soft);border-radius:3px;overflow-wrap:anywhere}
.nl-pipeline li strong,.nl-pipeline li span{display:block}.nl-pipeline li strong{font-size:16px;margin-bottom:8px}.nl-pipeline li span{font-variant-numeric:tabular-nums;font-size:16px;line-height:1.7}
.nl-tokens{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.nl-tokens>span{padding:7px 13px;border:1px solid var(--control-border);border-radius:4px;background:var(--surface)}.nl-tokens small{margin-right:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.nl-selected{background:var(--soft);box-shadow:inset 0 -2px 0 var(--accent);font-weight:650}
.nl-prob-track{display:block;width:clamp(70px,13vw,210px);height:13px;background:var(--soft);border-radius:2px}.nl-prob-track>span{display:block;height:100%;background:var(--accent);border-radius:2px}
.nl-plot{overflow-x:auto;margin:20px 0;border-bottom:1px solid var(--divider);padding-bottom:12px}.nl-plot svg{display:block;width:100%;min-width:480px;max-height:320px}.nl-plot text{font-family:inherit;font-size:15px;fill:var(--muted)}.nl-grid{stroke:var(--divider);stroke-width:1}.nl-axis{stroke:var(--control-border);stroke-width:1.4}.nl-line{stroke:var(--accent);stroke-width:2.7;fill:none}.nl-dot{fill:var(--accent)}
.nl-details{border-top:1px solid var(--divider);padding-top:12px;margin-top:22px}.nl-details summary{cursor:pointer;min-height:44px;padding:8px 0;color:var(--accent);font-weight:600}.nl-details li{overflow-wrap:anywhere}.nl-details p{overflow-wrap:anywhere}
.app[data-projector="true"] .nl-pipeline li strong,.app[data-projector="true"] .nl-pipeline li span{font-size:19px}.app[data-projector="true"] .nl-plot text{font-size:17px}
@media(max-width:480px){.nl-pipeline{gap:10px}.nl-pipeline li{min-width:155px}.nl-tokens>span{padding:6px 9px}.nl-prob-track{width:80px}}
