.eval-confusion .eval-fp, .eval-confusion .eval-fn { background: var(--target-soft); }
.eval-metric-row { grid-template-columns: repeat(2,minmax(0,1fr)); }
.data-table .eval-text-cell { min-width: 160px; max-width: 350px; white-space: normal; overflow-wrap: anywhere; text-align: left; }
.eval-filter-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 22px 0 8px; font-size: .9em; }
.eval-threshold-evidence { display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; align-items: start; }
.eval-pr-figure { min-width: 0; margin: 14px 0 10px; }
.eval-pr-plot { display: block; width: 100%; max-width: 680px; margin: 0 auto; color: var(--ink); }
.eval-pr-plot text { fill: currentColor; font-size: 13px; font-family: var(--sans); }
.eval-pr-figure figcaption { color: var(--muted); font-size: .82em; line-height: 1.65; padding: 0 6px; }
.eval-gridline { stroke: var(--divider); stroke-width: 1; }
.eval-axis { stroke: var(--muted); stroke-width: 1.2; }
.eval-pr-line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.eval-pr-dot { fill: var(--accent); }
.eval-current-dot { fill: var(--target); stroke: var(--surface); stroke-width: 2; }
.eval-pr-plot .eval-current-label { fill: var(--target); font-weight: 700; }
.eval-multiclass-input table { min-width: 560px; }
.eval-multiclass-input input { width: 110px; max-width: 100%; min-width: 72px; font-size: .95em; text-align: right; padding: 8px; }
.eval-multiclass-input .eval-diagonal { background: var(--soft); }
.eval-multiclass-input .eval-diagonal input { border-color: var(--accent); }
.experiment > .eval-confusion-wrap + .result-row { margin-top: 20px; }
.app[data-projector="true"] .eval-pr-plot { max-width: 850px; }
@media (min-width:1250px) {
  .eval-threshold-evidence { grid-template-columns: minmax(0,1fr) minmax(0,.9fr); gap: 18px; }
  .eval-threshold-evidence .eval-confusion { min-width: 350px; }
}
@media (max-width:540px) {
  .eval-confusion { min-width: 350px; }
  .eval-confusion-cell > div, .eval-confusion-cell > button { min-height: 80px; padding: 8px; }
  .eval-confusion-cell strong { font-size: 1.4em; }
  .eval-metric-row { grid-template-columns: minmax(0,1fr); }
}

.stats-dataset .stats-document { width: 270px; min-width: 180px; max-width: 340px; text-align: left; white-space: normal; }
.stats-document strong { display: block; margin-bottom: 4px; font-family: var(--mono); color: var(--muted); font-size: .85em; }
.stats-document span { display: block; overflow-wrap: anywhere; }
.stats-dataset .data-table select { min-width: 96px; min-height: 44px; padding: 6px 8px; font-size: .92em; }
.stats-dataset .stats-pair-aOnly td:last-child { color: var(--accent); font-weight: 650; }
.stats-dataset .stats-pair-bOnly td:last-child { color: var(--target); font-weight: 650; }
.stats-pair-summary { display: flex; flex-wrap: wrap; gap: 9px 22px; margin: 18px 0; }
.stats-pair-summary > span { padding: 6px 0; border-bottom: 2px solid var(--divider); }
.stats-pair-summary .stats-pair-aOnly { border-color: var(--accent); }
.stats-pair-summary .stats-pair-bOnly { border-color: var(--target); }
.stats-pair-summary strong { display: inline-block; min-width: 24px; margin-left: 5px; font-family: var(--mono); }
.stats-seed { min-width: 150px; max-width: 240px; }
.stats-source-pool, .stats-sample-strip { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 10px; margin: 16px 0 24px; }
.stats-source-pool button, .stats-sample-strip button { display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; min-height: 76px; padding: 8px 6px; border: 1px solid var(--control-border); border-radius: var(--token-radius); background: var(--surface); color: var(--ink); text-align: center; }
.stats-source-pool strong, .stats-sample-strip strong { font-family: var(--mono); font-size: 1.1em; }
.stats-source-pool button span, .stats-sample-strip button span, .stats-sample-strip button small { font-size: 14px; line-height: 1.55; }
.stats-sample-strip button small { color: var(--muted); }
.stats-source-pool button.stats-selected, .stats-sample-strip button.stats-selected { border: 2px solid var(--accent); background: var(--soft); color: var(--accent); }
.stats-source-pool button.stats-omitted { border-style: dashed; color: var(--muted); }
.stats-chart-wrap { width: 100%; max-width: 100%; margin: 20px 0 10px; overflow-x: auto; padding: 4px 0; }
.stats-plot { display: block; width: 100%; min-width: 620px; height: auto; }
.stats-plot text { fill: var(--muted); font-family: var(--sans); font-size: 14px; }
.stats-plot .stats-grid { stroke: var(--divider); stroke-width: 1; }
.stats-plot .stats-axis { stroke: var(--control-border); stroke-width: 1; }
.stats-plot .stats-bar { fill: var(--accent); }
.stats-plot .stats-bar-tail { fill: var(--target); }
.stats-plot .stats-threshold { stroke: var(--target); stroke-width: 2; stroke-dasharray: 5 4; }
.stats-plot .stats-tail-text { fill: var(--target); font-weight: 650; font-size: 13px; }
.stats-legend { display: flex; flex-wrap: wrap; gap: 10px 24px; color: var(--muted); font-size: var(--small-size); }
.stats-legend span { display: inline-flex; align-items: center; gap: 8px; }
.stats-swatch { display: inline-block; width: 16px; height: 12px; background: var(--accent); }
.stats-swatch-tail { background: var(--target); }
.stats-count-controls { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin: 22px 0; }
.stats-count-controls .field { min-width: 0; }
.stats-count-controls input { width: 100%; min-width: 0; }
.data-table .stats-answer { min-width: 260px; max-width: 580px; white-space: normal; text-align: left; }
@media (max-width:780px) {
  .stats-count-controls { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .stats-source-pool, .stats-sample-strip { grid-template-columns: repeat(5,minmax(58px,1fr)); gap: 6px; }
}
@media (max-width:480px) {
  .stats-source-pool, .stats-sample-strip { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .stats-pair-summary { gap: 4px 16px; font-size: .92em; }
  .stats-dataset .data-table select { min-width: 92px; }
}
.app[data-projector="true"] .stats-source-pool button span,
.app[data-projector="true"] .stats-sample-strip button span,
.app[data-projector="true"] .stats-sample-strip button small { font-size: 18px; }
