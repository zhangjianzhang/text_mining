<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="正则表达式与文本标准化：22 个交互实验，涵盖语料、预处理、分词、BPE、编辑距离与 Token 费用。无需联网。">
  <title>正则与文本标准化 · 交互讲义</title>
  <style>/* Interactive Notes: the application fixes data-theme="notes".
   Compatibility selectors are retained to preserve the approved layout cascade. */

* { box-sizing: border-box; }
html { margin: 0; scroll-behavior: smooth; }
body { margin: 0; }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
svg { max-width: 100%; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }

.app {
  --page: #F3F7FC;
  --surface: #FFFFFF;
  --ink: #182D48;
  --muted: #51647C;
  --accent: #1C54C4;
  --target: #A74E0A;
  --soft: #E8EFFD;
  --target-soft: #FFF1DE;
  --control-border: #7B8CA7;
  --divider: #D5DFEF;
  --danger: #A52939;
  --danger-soft: #FFF0F1;
  --radius: 16px;
  --button-radius: 9px;
  --token-radius: 6px;
  --body-size: 18px;
  --small-size: 15px;
  --title-size: 40px;
  --heading-size: 25px;
  --section-gap: 28px;
  --page-width: 1460px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --serif: Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif;
  min-height: 100vh;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--body-size);
  line-height: 1.65;
  font-variant-numeric: tabular-nums;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}

.app[data-theme="lab"] {
  --page: #F1F6F3;
  --ink: #15382E;
  --muted: #4B645A;
  --accent: #13664F;
  --target: #945016;
  --soft: #E2F1EA;
  --target-soft: #FFF1DE;
  --control-border: #718B7E;
  --divider: #D1E1D7;
  --radius: 10px;
  --button-radius: 6px;
  --token-radius: 4px;
  --title-size: 34px;
  --heading-size: 24px;
  --section-gap: 22px;
  --page-width: 1580px;
}

.app[data-theme="notes"] {
  --page: #F5F5F7;
  --ink: #272433;
  --muted: #655D72;
  --accent: #644C96;
  --target: #8E4D14;
  --soft: #EFEAF8;
  --target-soft: #FFF0DF;
  --control-border: #91849F;
  --divider: #DAD5E3;
  --radius: 8px;
  --button-radius: 5px;
  --token-radius: 4px;
  --body-size: 18px;
  --title-size: 40px;
  --heading-size: 26px;
  --section-gap: 30px;
  --page-width: 1390px;
  line-height: 1.8;
}

.app h1, .app h2, .app h3, .app p { margin-top: 0; }
.app h1 { margin-bottom: 12px; font-size: var(--title-size); font-weight: 750; line-height: 1.25; letter-spacing: -.025em; }
.app h2 { margin-bottom: 14px; font-size: var(--heading-size); font-weight: 700; line-height: 1.4; letter-spacing: -.015em; }
.app h3 { margin: 22px 0 10px; font-size: 1.06em; line-height: 1.5; }
.app p { margin-bottom: 16px; }
.app p:last-child { margin-bottom: 0; }
.app a { color: var(--accent); text-underline-offset: 3px; }
.app strong { font-weight: 700; }
.app small, .app .small { font-size: var(--small-size); }
.app code { font-family: var(--mono); font-size: .92em; }
.app ul, .app ol { padding-left: 1.45em; margin: 12px 0 18px; }
.app li + li { margin-top: 8px; }
.app pre { max-width: 100%; overflow-x: auto; font-family: var(--mono); font-size: .9em; line-height: 1.65; tab-size: 2; }
.app ::selection { background: var(--soft); color: var(--accent); }
.app :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px max(28px, calc((100% - var(--page-width)) / 2 + 28px));
  background: var(--surface);
  border-bottom: 1px solid var(--divider);
}
.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; font-size: 21px; font-weight: 750; line-height: 1.35; letter-spacing: -.025em; }
.brand svg { flex: 0 0 auto; width: 34px; height: 34px; color: var(--accent); }
.brand small { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 400; letter-spacing: 0; }
.header-actions { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 10px; min-width: 0; font-size: 15px; }
.header-actions .field { margin: 0; min-width: 0; }
.header-actions .button, .header-actions button, .header-actions select { min-height: 42px; padding-top: 7px; padding-bottom: 7px; }
.header-actions .theme-picker, .header-actions .segmented { margin: 0; }
.theme-picker { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.theme-picker button { font-size: 15px; }

.layout { max-width: var(--page-width); margin: 0 auto; padding: 0 28px; }
.sidebar { min-width: 0; }
.sidebar button, .sidebar a {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 44px;
  margin: 0;
  padding: 10px 12px;
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: var(--button-radius);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.4;
  text-align: left;
  text-decoration: none;
}
.sidebar button:hover, .sidebar a:hover { background: var(--soft); color: var(--accent); }
.sidebar button.active, .sidebar a.active, .sidebar [aria-current="page"], .sidebar [aria-selected="true"] { background: var(--soft); color: var(--accent); font-weight: 700; }
.sidebar .nav-number, .sidebar .nav-no { min-width: 24px; font-family: var(--mono); font-size: .85em; opacity: .8; }
.sidebar .nav-section { padding: 20px 12px 7px; color: var(--muted); font-size: 13px; font-weight: 650; }
.sidebar .nav-footnote { padding: 18px 12px 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.main-content { min-width: 0; padding: 32px 0 64px; }
.lesson-header { max-width: 1120px; margin-bottom: 26px; }
.lead { max-width: 60em; color: var(--muted); font-size: 1.06em; line-height: 1.75; }
.lesson-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; color: var(--muted); font-size: var(--small-size); }
.source-note { color: var(--muted); font-size: var(--small-size); line-height: 1.7; }
.lesson-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(285px, 1fr); gap: var(--section-gap); align-items: start; }
.experiment { min-width: 0; padding: 26px; background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius); }
.explanation { min-width: 0; padding: 4px 0; }
.explanation h2 { margin-top: 0; }
.explanation .formula { font-size: .92em; }
.explanation p, .explanation li { line-height: 1.8; }
.explanation .source-note { margin-top: 24px; padding-top: 15px; border-top: 1px solid var(--divider); }
.experiment-section + .experiment-section { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--divider); }
.section-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
.section-heading h2, .section-heading h3 { margin: 0; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
.three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
.stack > * + * { margin-top: 18px; }
.wide { grid-column: 1 / -1; }

/* A: a teaching stage, with a horizontal topic strip. */
.app[data-theme="lecture"] .sidebar { display: flex; align-items: stretch; gap: 5px; padding: 13px 0; overflow-x: auto; border-bottom: 1px solid var(--divider); scrollbar-width: thin; scroll-snap-type: x proximity; }
.app[data-theme="lecture"] .sidebar > button, .app[data-theme="lecture"] .sidebar > a { flex: 0 0 auto; white-space: nowrap; scroll-snap-align: start; }
.app[data-theme="lecture"] .sidebar .nav-section, .app[data-theme="lecture"] .sidebar .nav-footnote { display: none; }
.app[data-theme="lecture"] .sidebar .nav-number, .app[data-theme="lecture"] .sidebar .nav-no { display: none; }
.app[data-theme="lecture"] .experiment { box-shadow: 0 5px 20px rgba(24, 45, 72, .035); }
.app[data-theme="lecture"] .token-strip { padding-top: 20px; padding-bottom: 20px; }

/* B: an analytical workspace, with a persistent topic rail. */
.app[data-theme="lab"] .site-header { border-bottom: 3px solid var(--accent); }
.app[data-theme="lab"] .layout { display: grid; grid-template-columns: 214px minmax(0, 1fr); gap: 30px; padding-top: 28px; }
.app[data-theme="lab"] .sidebar { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 40px); padding: 10px 7px; overflow-y: auto; background: var(--soft); border-radius: 10px; scrollbar-width: thin; }
.app[data-theme="lab"] .sidebar button, .app[data-theme="lab"] .sidebar a { width: 100%; color: var(--ink); }
.app[data-theme="lab"] .sidebar button.active, .app[data-theme="lab"] .sidebar a.active, .app[data-theme="lab"] .sidebar [aria-current="page"], .app[data-theme="lab"] .sidebar [aria-selected="true"] { background: var(--accent); color: #FFFFFF; }
.app[data-theme="lab"] .main-content { padding-top: 0; }
.app[data-theme="lab"] .lesson-grid { grid-template-columns: minmax(0, 1.8fr) minmax(260px, 1fr); }
.app[data-theme="lab"] .experiment { padding: 23px; }
.app[data-theme="lab"] .controls { padding-bottom: 18px; border-bottom: 1px solid var(--divider); }
.app[data-theme="lab"] .data-table { font-size: .9em; }
.app[data-theme="lab"] .bar-track { border-radius: 2px; }
.app[data-theme="lab"] .bar-fill { border-radius: 2px; }

/* C: an interactive course reader, with experiments in the reading flow. */
.app[data-theme="notes"] .site-header { background: var(--page); border-bottom: 1px solid var(--control-border); }
.app[data-theme="notes"] .brand { font-family: var(--serif); font-size: 25px; }
.app[data-theme="notes"] .layout { display: grid; grid-template-columns: 185px minmax(0, 1fr); gap: 45px; }
.app[data-theme="notes"] .sidebar { position: sticky; top: 28px; align-self: start; display: flex; flex-direction: column; gap: 5px; max-height: calc(100vh - 56px); padding: 33px 15px 16px 0; overflow-y: auto; border-right: 1px solid var(--divider); scrollbar-width: thin; }
.app[data-theme="notes"] .sidebar button, .app[data-theme="notes"] .sidebar a { padding: 9px 10px; }
.app[data-theme="notes"] .main-content { max-width: 1010px; padding-top: 37px; }
.app[data-theme="notes"] .lesson-header { margin-bottom: 30px; }
.app[data-theme="notes"] .lesson-header h1 { font-family: var(--serif); font-weight: 700; letter-spacing: 0; }
.app[data-theme="notes"] .lesson-grid { grid-template-columns: minmax(0, 1fr); gap: 32px; }
.app[data-theme="notes"] .experiment { padding: 28px 32px; }
.app[data-theme="notes"] .explanation { width: 100%; max-width: 880px; margin: 0 auto; padding: 24px 0 0; border-top: 1px solid var(--divider); }
.app[data-theme="notes"] .explanation h2 { font-family: var(--serif); font-size: 27px; }
.app[data-theme="notes"] .explanation .formula { padding: 18px 22px; font-size: 1em; }
.app[data-theme="notes"] .formula { border-radius: 3px; }
.app[data-theme="notes"] .callout { background: transparent; padding: 16px 0; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); border-radius: 0; }

/* Shared controls. */
.controls { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 13px 16px; margin-bottom: 22px; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 140px; max-width: 100%; }
.field > label, .field > .field-label { font-size: .9em; color: var(--ink); font-weight: 600; }
.field.grow, .grow { flex: 1 1 240px; }
.field.full { flex-basis: 100%; width: 100%; }
.field small { color: var(--muted); }
.field input[type="range"] { min-width: 170px; }
.app input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), .app select, .app textarea {
  min-width: 0;
  max-width: 100%;
  min-height: 44px;
  padding: 9px 12px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--control-border);
  border-radius: var(--button-radius);
  line-height: 1.5;
}
.app input[type="number"] { width: 110px; }
.app input[type="text"] { width: 100%; }
.app input[type="range"] { width: 100%; min-height: 44px; margin: 0; padding: 0; accent-color: var(--accent); cursor: pointer; }
.app input[type="checkbox"], .app input[type="radio"] { accent-color: var(--accent); width: 19px; height: 19px; flex: 0 0 auto; }
.app input:disabled, .app select:disabled, .app textarea:disabled { color: var(--muted); background: var(--page); cursor: not-allowed; }
.app textarea { display: block; width: 100%; min-height: 148px; resize: vertical; font-family: var(--mono); font-size: .92em; line-height: 1.8; tab-size: 2; }
.app input::placeholder, .app textarea::placeholder { color: var(--muted); opacity: 1; }
.check-label { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; cursor: pointer; font-size: .92em; }
.button, :where(.app) button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 9px 15px;
  border: 1px solid var(--control-border);
  border-radius: var(--button-radius);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  line-height: 1.4;
  text-decoration: none;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.button:hover, :where(.app) button:hover { background: var(--soft); border-color: var(--accent); color: var(--accent); }
.button.primary, :where(.app) button.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.button.primary:hover, :where(.app) button.primary:hover { filter: brightness(.93); color: #FFFFFF; }
.button.subtle, :where(.app) button.subtle { background: transparent; border-color: transparent; color: var(--accent); }
.button.subtle:hover, :where(.app) button.subtle:hover { background: var(--soft); }
.button:disabled, :where(.app) button:disabled { color: var(--muted); background: var(--page); border-color: var(--divider); opacity: .8; filter: none; }
.button svg, :where(.app) button svg { width: 18px; height: 18px; flex: 0 0 auto; }
.segmented { display: inline-flex; align-items: stretch; flex-wrap: wrap; gap: 4px; max-width: 100%; padding: 4px; border: 1px solid var(--divider); border-radius: calc(var(--button-radius) + 4px); background: var(--page); }
.segmented button, .theme-picker button { background: transparent; border-color: transparent; font-weight: 500; }
.segmented button[aria-pressed="true"], .segmented button.active, .segmented button[aria-selected="true"], .theme-picker button[aria-pressed="true"], .theme-picker button.active { color: #FFFFFF; background: var(--accent); border-color: var(--accent); font-weight: 650; }
.segmented button:hover, .theme-picker button:hover { border-color: var(--accent); }
.action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.inline-field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* The words and their statistical roles. */
.token-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin: 12px 0 20px; padding: 12px 0; }
.token { display: inline-flex; position: relative; align-items: center; justify-content: center; flex: 0 0 auto; gap: 5px; min-height: 43px; padding: 8px 12px; border: 1px solid var(--divider); border-radius: var(--token-radius); background: var(--page); color: var(--ink); font-family: var(--mono); font-size: 1.02em; line-height: 1.35; }
button.token { font-weight: 500; }
.token.context { background: var(--soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.token.target { color: var(--target); background: var(--target-soft); border: 2px solid var(--target); padding: 7px 11px; font-weight: 700; }
.token.muted { color: var(--muted); background: transparent; border-style: dashed; }
.token.boundary { font-size: .9em; border-style: dashed; }
.token small { font-family: var(--sans); font-size: 11px; font-weight: 600; }
.token-label { font-family: var(--sans); font-size: var(--small-size); color: var(--muted); }
.legend { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; margin: 5px 0 18px; color: var(--muted); font-size: var(--small-size); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend-dot { display: inline-block; width: 12px; height: 12px; background: var(--accent); border-radius: 2px; }
.legend-dot.target { background: var(--target); }
.context-text { color: var(--accent); font-weight: 700; }
.target-text { color: var(--target); font-weight: 700; }
.muted-text, .muted { color: var(--muted); }
.danger-text { color: var(--danger); font-weight: 600; }

/* Formula and evidence, kept visually connected to the experiment. */
.formula { max-width: 100%; margin: 18px 0; padding: 16px 18px; overflow-x: auto; background: var(--soft); border-radius: calc(var(--radius) / 2); color: var(--ink); font-family: var(--mono); font-size: .96em; line-height: 1.8; }
.formula:last-child { margin-bottom: 0; }
.formula .formula-label { display: block; margin-bottom: 8px; color: var(--muted); font-family: var(--sans); font-size: .85em; }
.formula .substitution { display: block; margin-top: 9px; color: var(--accent); }
.formula math { max-width: none; font-size: 1.1em; }
.formula sub, .formula sup { line-height: 0; }
.formula-line { display: block; width: max-content; min-width: 100%; white-space: nowrap; }
.result-row { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 16px 24px; margin: 22px 0; padding: 19px 0; border-top: 1px solid var(--divider); border-bottom: 1px solid var(--divider); }
.metric { flex: 1 1 130px; min-width: 0; }
.metric > span, .metric > small, .metric .metric-label { display: block; color: var(--muted); font-size: var(--small-size); }
.metric > strong, .metric .metric-value { display: block; margin-top: 5px; color: var(--accent); font-size: 31px; font-weight: 750; line-height: 1.25; overflow-wrap: anywhere; }
.metric .metric-value.target, .metric > strong.target { color: var(--target); }
.callout { margin: 18px 0; padding: 15px 18px; background: var(--soft); border-radius: calc(var(--radius) / 2); color: var(--ink); font-size: .95em; }
.callout.warning { background: #FFF3DF; color: #65390F; }
.callout.error, .error-message { color: var(--danger); background: var(--danger-soft); }
.error-message { padding: 11px 14px; border-radius: var(--button-radius); font-size: .9em; }
.callout.success { background: var(--soft); color: var(--accent); }
.callout p { margin-bottom: 10px; }
.callout p:last-child { margin-bottom: 0; }
.empty-state { padding: 28px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--control-border); border-radius: var(--radius); }

/* Exact quantities remain labelled even when colour carries meaning. */
.chart { width: 100%; min-width: 0; margin: 18px 0; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 115px) minmax(0, 1fr) minmax(54px, 70px); align-items: center; gap: 12px; margin: 10px 0; }
.bar-label { font-size: .9em; line-height: 1.45; overflow-wrap: anywhere; }
.bar-track { width: 100%; min-width: 0; height: 24px; overflow: hidden; background: var(--page); border: 1px solid var(--divider); border-radius: 4px; }
.bar-fill { height: 100%; min-width: 0; max-width: 100%; background: var(--accent); border-radius: 3px; transition: width .18s ease; }
.bar-fill.target { background: var(--target); }
.bar-fill.secondary { background: var(--control-border); }
.bar-row.selected .bar-label, .bar-row.selected .bar-value { color: var(--accent); font-weight: 700; }
.bar-value { font-family: var(--mono); font-size: .85em; line-height: 1.4; text-align: right; }
.chart-caption { margin-top: 10px; color: var(--muted); font-size: var(--small-size); line-height: 1.65; }
.probability-strip { display: flex; width: 100%; min-height: 56px; overflow: hidden; border: 1px solid var(--control-border); border-radius: var(--token-radius); }
.probability-strip > * { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; padding: 5px 3px; font-family: var(--mono); font-size: .82em; }
.plot { display: block; width: 100%; height: auto; overflow: visible; }
.plot text { fill: var(--muted); font-family: var(--sans); }
.plot .axis { stroke: var(--control-border); }
.plot .gridline { stroke: var(--divider); }
.plot .series { stroke: var(--accent); }

.table-wrap { width: 100%; max-width: 100%; margin: 18px 0; overflow-x: auto; border: 1px solid var(--divider); border-radius: calc(var(--radius) / 2); -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; color: var(--ink); background: var(--surface); font-size: .9em; line-height: 1.5; }
.data-table th, .data-table td { padding: 11px 12px; border-bottom: 1px solid var(--divider); text-align: right; vertical-align: middle; white-space: nowrap; }
.data-table th { font-weight: 650; color: var(--muted); background: var(--page); }
.data-table th:first-child, .data-table td:first-child { text-align: left; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tr.selected td, .data-table tr.active td, .data-table td.selected { color: var(--accent); background: var(--soft); font-weight: 650; }
.data-table td.zero { color: var(--danger); font-weight: 600; }

.cp-token-value { white-space: pre-wrap; overflow-wrap: anywhere; }
.data-table .cp-wrap-cell { max-width: 240px; white-space: normal; overflow-wrap: anywhere; }
.cp-weight-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 30px; margin: 22px 0; }
.cp-weight-controls .range-field { min-width: 0; }
.cp-corpus-samples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 30px; }
.cp-corpus-samples li { font-size: .91em; line-height: 1.7; }
.cp-sample-verdict { display: block; color: var(--muted); font-size: .9em; }
.cp-sample-verdict.matched { color: var(--accent); font-weight: 600; }
.cp-statement-options { display: flex; flex-wrap: wrap; gap: 7px 22px; margin: 18px 0 12px; }
.app .cp-statement { min-height: 265px; background: var(--page); font-family: var(--sans); line-height: 1.8; }
.cp-budget-inputs .data-table th, .cp-budget-inputs .data-table td { padding: 10px; }
.cp-budget-inputs input[type="text"] { width: 135px; min-width: 100px; }
.cp-budget-inputs input[type="number"] { width: 105px; }
@media (max-width: 900px) {
  .cp-hierarchy { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cp-hierarchy li { border-bottom: 1px solid var(--divider); }
  .cp-hierarchy li:nth-child(2n) { border-right: 0; }
  .cp-hierarchy li:nth-last-child(-n+2) { border-bottom: 0; }
  .cp-hierarchy li:nth-child(3) { padding-left: 0; }
}
@media (max-width: 650px) {
  .cp-weight-controls, .cp-corpus-samples { grid-template-columns: minmax(0, 1fr); }
  .cp-addition-row > .field.full { max-width: none; flex-basis: 100%; }
  .cp-token-picker { max-height: 280px; }
  .cp-hierarchy li { padding: 12px; }
  .cp-statement-options { column-gap: 15px; }
}

.alg-tokens { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; max-width: 100%; vertical-align: middle; }
.alg-token { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-height: 32px; padding: 3px 7px; border: 1px solid var(--divider); border-radius: 4px; background: var(--page); color: var(--ink); font-family: var(--mono); font-size: .9em; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; }
.alg-token.alg-next-pair { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.alg-token.alg-unknown { border: 2px dashed var(--danger); color: var(--danger); background: var(--danger-soft); }
.alg-token small { font-family: var(--sans); font-size: 11px; }
.alg-corpus-table .data-table td:nth-child(3) { white-space: normal; min-width: 240px; text-align: left; }
.alg-corpus-table .data-table th:nth-child(3) { text-align: left; }
.alg-input-details { margin-bottom: 24px !important; }
.alg-input-details textarea { min-height: 140px; }
.alg-step-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 20px 0; }
.alg-step-controls > span { color: var(--muted); font-size: var(--small-size); }
.alg-scroll-list { max-height: 360px; overflow: auto; margin: 18px 0; border-bottom: 1px solid var(--divider); }
.alg-scroll-list .table-wrap { margin: 0; }
.alg-scroll-list .data-table td { white-space: normal; overflow-wrap: anywhere; }
.alg-scroll-list .data-table td code { white-space: pre-wrap; }
.alg-input-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; margin-bottom: 12px; }
.alg-input-grid .field { min-width: 0; }
.alg-input-grid input { font-family: var(--mono); }
.alg-character-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 24px; }
.app .alg-character-row button { display: flex; flex-direction: column; min-width: 52px; padding: 8px 10px; font-family: var(--mono); }
.alg-character-row button[aria-pressed="true"] { border: 2px solid var(--accent); color: var(--accent); background: var(--soft); padding: 7px 9px; }
.alg-character-row small { font-family: var(--sans); font-size: 11px; color: var(--muted); }
.alg-live-string { display: inline-block; max-width: 100%; padding: 6px 10px; background: var(--soft); color: var(--accent); font-family: var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.alg-prefix { padding: 14px 0; border-bottom: 1px solid var(--divider); overflow-wrap: anywhere; }
.alg-matrix-wrap { max-height: 650px; overflow: auto; }
.alg-matrix { width: max-content; min-width: 100%; border-collapse: collapse; background: var(--surface); font-variant-numeric: tabular-nums; }
.alg-matrix caption { caption-side: bottom; padding: 12px; text-align: left; font-size: var(--small-size); color: var(--muted); }
.alg-matrix th { min-width: 45px; padding: 7px 5px; border: 1px solid var(--divider); font-weight: 650; text-align: center; background: var(--page); }
.alg-matrix th small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
.alg-matrix th.alg-axis { min-width: 100px; font-family: var(--sans); font-size: 12px; }
.alg-matrix td { padding: 0; border: 1px solid var(--divider); text-align: center; }
.app .alg-matrix td button, .alg-matrix td > span { display: inline-flex; justify-content: center; align-items: center; width: 100%; min-width: 44px; min-height: 44px; margin: 0; padding: 5px; border: 0; border-radius: 0; font-family: var(--mono); font-size: .9em; font-weight: 500; background: transparent; color: var(--ink); }
.alg-matrix td.alg-cell-pending { background: var(--page); }
.alg-matrix td.alg-cell-pending button { color: var(--muted); }
.alg-matrix td.alg-cell-path { background: var(--soft); }
.alg-matrix td.alg-cell-path > span { color: var(--accent); font-weight: 750; }
.alg-matrix td.alg-cell-selected { position: relative; outline: 2px solid var(--target); outline-offset: -2px; background: var(--target-soft); }
.alg-matrix td.alg-cell-selected > span, .alg-matrix td.alg-cell-selected > button { color: var(--target); font-weight: 750; }
.alg-alignment table { width: max-content; min-width: 100%; border-collapse: collapse; }
.alg-alignment th, .alg-alignment td { padding: 9px 12px; min-width: 43px; border: 1px solid var(--divider); text-align: center; font-family: var(--mono); }
.alg-alignment th { font-family: var(--sans); background: var(--page); }
.alg-alignment .alg-gap { color: var(--muted); background: var(--page); }
.alg-candidate-table td:nth-child(2), .alg-candidate-table td:nth-child(3) { min-width: 130px; white-space: normal; overflow-wrap: anywhere; text-align: left; }
.alg-candidate-table th:nth-child(2), .alg-candidate-table th:nth-child(3) { text-align: left; }
.app[data-projector="true"] .alg-token { min-height: 40px; padding: 4px 9px; }
.app[data-projector="true"] .alg-matrix td > span { min-height: 48px; min-width: 48px; }
@media (max-width:650px) {
  .alg-input-grid { grid-template-columns: minmax(0,1fr); }
  .alg-step-controls { gap: 8px; }
  .alg-step-controls > span { flex-basis: 100%; }
  .alg-token { font-size: .86em; }
  .alg-matrix th.alg-axis { min-width: 76px; font-size: 11px; }
  .alg-scroll-list { max-height: 320px; }
}
</style>
</head>
