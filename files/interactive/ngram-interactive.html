.app[data-projector="true"] .lesson-header h1 { font-family: var(--sans); }

.app[data-projector="true"] .metric > strong, .app[data-projector="true"] .metric .metric-value { font-size: 40px; }

.app[data-projector="true"] .bar-track { height: 30px; }
.app[data-projector="true"] .bar-row { grid-template-columns: minmax(100px, 145px) minmax(0, 1fr) 86px; }
.app[data-projector="true"] .data-table th, .app[data-projector="true"] .data-table td { padding: 12px 14px; }
.app[data-projector="true"] .explanation h2 { font-family: var(--sans); font-size: var(--heading-size); }
.app[data-projector="true"] .button, .app[data-projector="true"] button, .app[data-projector="true"] input, .app[data-projector="true"] select { min-height: 48px; }

@media (min-width: 1600px) {

}
