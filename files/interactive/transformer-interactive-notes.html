/* A: a teaching stage, with a horizontal topic strip. */

.app[data-theme="notes"] .sidebar button, .app[data-theme="notes"] .sidebar a { padding: 9px 10px; }

/* Shared controls. */

.field input[type="range"] { min-width: 170px; }
.app input:not([type="range"]):not([type="checkbox"]):not([type="radio"]), .app select, .app textarea {
  min-width: 0;
  max-width: 100%;
  min-height: 44px;

}
.app input[type="number"] { width: 110px; }

.check-label { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; cursor: pointer; font-size: .92em; }
.button, :where(.app) button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 9px 15px;
  border: 1px solid var(--control-border);
  border-radius: var(--button-radius);

  color: var(--ink);

  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.button:hover, :where(.app) button:hover { background: var(--soft); border-color: var(--accent); color: var(--accent); }

.button.primary:hover, :where(.app) button.primary:hover { filter: brightness(.93); color: #FFFFFF; }

.button svg, :where(.app) button svg { width: 18px; height: 18px; flex: 0 0 auto; }
.segmented { display: inline-flex; align-items: stretch; flex-wrap: wrap; gap: 4px; max-width: 100%; padding: 4px; border: 1px solid var(--divider); border-radius: calc(var(--button-radius) + 4px); background: var(--page); }
.segmented button, .theme-picker button { background: transparent; border-color: transparent; font-weight: 500; }
.segmented button[aria-pressed="true"], .segmented button.active, .segmented button[aria-selected="true"], .theme-picker button[aria-pressed="true"], .theme-picker button.active { color: #FFFFFF; background: var(--accent); border-color: var(--accent); font-weight: 650; }
.segmented button:hover, .theme-picker button:hover { border-color: var(--accent); }
.action-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.inline-field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* The words and their statistical roles. */
.token-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin: 12px 0 20px; padding: 12px 0; }
.token { display: inline-flex; position: relative; align-items: center; justify-content: center; flex: 0 0 auto; gap: 5px; min-height: 43px; padding: 8px 12px; border: 1px solid var(--divider); border-radius: var(--token-radius); background: var(--page); color: var(--ink); font-family: var(--mono); font-size: 1.02em; line-height: 1.35; }
button.token { font-weight: 500; }
.token.context { background: var(--soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.token.target { color: var(--target); background: var(--target-soft); border: 2px solid var(--target); padding: 7px 11px; font-weight: 700; }

.formula { max-width: 100%; margin: 18px 0; padding: 16px 18px; overflow-x: auto; background: var(--soft); border-radius: calc(var(--radius) / 2); color: var(--ink); font-family: var(--mono); font-size: .96em; line-height: 1.8; }
.formula:last-child { margin-bottom: 0; }

.metric .metric-value.target, .metric > strong.target { color: var(--target); }
.callout { margin: 18px 0; padding: 15px 18px; background: var(--soft); border-radius: calc(var(--radius) / 2); color: var(--ink); font-size: .95em; }

.error-message { padding: 11px 14px; border-radius: var(--button-radius); font-size: .9em; }
.callout.success { background: var(--soft); color: var(--accent); }
.callout p { margin-bottom: 10px; }

.empty-state { padding: 28px 18px; text-align: center; color: var(--muted); border: 1px dashed var(--control-border); border-radius: var(--radius); }

/* Exact quantities remain labelled even when colour carries meaning. */
.chart { width: 100%; min-width: 0; margin: 18px 0; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 115px) minmax(0, 1fr) minmax(54px, 70px); align-items: center; gap: 12px; margin: 10px 0; }
.bar-label { font-size: .9em; line-height: 1.45; overflow-wrap: anywhere; }
.bar-track { width: 100%; min-width: 0; height: 24px; overflow: hidden; background: var(--page); border: 1px solid var(--divider); border-radius: 4px; }
.bar-fill { height: 100%; min-width: 0; max-width: 100%; background: var(--accent); border-radius: 3px; transition: width .18s ease; }
.bar-fill.target { background: var(--target); }
.bar-fill.secondary { background: var(--control-border); }
.bar-row.selected .bar-label, .bar-row.selected .bar-value { color: var(--accent); font-weight: 700; }
.bar-value { font-family: var(--mono); font-size: .85em; line-height: 1.4; text-align: right; }
.chart-caption { margin-top: 10px; color: var(--muted); font-size: var(--small-size); line-height: 1.65; }
.probability-strip { display: flex; width: 100%; min-height: 56px; overflow: hidden; border: 1px solid var(--control-border); border-radius: var(--token-radius); }
.probability-strip > * { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; padding: 5px 3px; font-family: var(--mono); font-size: .82em; }
.plot { display: block; width: 100%; height: auto; overflow: visible; }
.plot text { fill: var(--muted); font-family: var(--sans); }
.plot .axis { stroke: var(--control-border); }
.plot .gridline { stroke: var(--divider); }
.plot .series { stroke: var(--accent); }

.table-wrap { width: 100%; max-width: 100%; margin: 18px 0; overflow-x: auto; border: 1px solid var(--divider); border-radius: calc(var(--radius) / 2); -webkit-overflow-scrolling: touch; }
.data-table { width: 100%; border-collapse: collapse; color: var(--ink); background: var(--surface); font-size: .9em; line-height: 1.5; }
.data-table th, .data-table td { padding: 11px 12px; border-bottom: 1px solid var(--divider); text-align: right; vertical-align: middle; white-space: nowrap; }
.data-table th { font-weight: 650; color: var(--muted); background: var(--page); }
.data-table th:first-child, .data-table td:first-child { text-align: left; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tr.selected td, .data-table tr.active td, .data-table td.selected { color: var(--accent); background: var(--soft); font-weight: 650; }
.data-table td.zero { color: var(--danger); font-weight: 600; }
