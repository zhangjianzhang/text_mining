/* Local presentation for Encoder–Decoder / Attention. Fixed notes theme remains unchanged. */
.at-help { color: var(--muted); font-size: .92em; line-height: 1.7; margin: .3rem 0 1rem; }
.at-result { padding: .85rem 1rem; border-left: 3px solid var(--accent); background: var(--soft); line-height: 1.8; }
.at-mono { font-family: var(--mono); font-size: .9em; overflow-wrap: anywhere; }
.at-tokens { display: flex; flex-wrap: wrap; gap: .55rem; margin: 1rem 0; }
.at-token { display: inline-flex; align-items: center; gap: .6rem; padding: .42rem .75rem; border: 1px solid var(--divider); border-radius: .4rem; background: var(--surface); font-family: var(--mono); }
.at-token small { color: var(--muted); font-size: .75em; border-right: 1px solid var(--divider); padding-right: .5rem; }
.at-details { margin: 1rem 0; border: 1px solid var(--divider); border-radius: .5rem; background: var(--surface); padding: .85rem 1rem; }
.at-details summary { color: var(--accent); cursor: pointer; font-weight: 600; line-height: 1.7; }
.at-details summary:focus-visible, .at-row-button:focus-visible, .at-svg-wrap:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.at-details p { line-height: 1.8; }
.at-weights { display: grid; gap: .65rem; margin: 1.1rem 0; }
.at-weight { display: grid; grid-template-columns: minmax(5rem, 1fr) minmax(7rem, 4fr) minmax(4.5rem, .8fr); gap: .85rem; align-items: center; font-size: .95em; }
.at-weight > span:first-child { overflow-wrap: anywhere; }
.at-weight > strong { text-align: right; font-family: var(--mono); font-size: .94em; }
.at-weight-track { height: .7rem; background: var(--soft); overflow: hidden; border-radius: 1rem; }
.at-weight-track > span { display: block; height: 100%; background: var(--accent); min-width: 0; border-radius: 1rem; }
.at-svg-wrap { overflow-x: auto; margin: 1.3rem 0; padding: .8rem .4rem; border: 1px solid var(--divider); border-radius: .55rem; background: var(--surface); }
.at-svg-wrap svg { width: 100%; min-width: 470px; max-height: 470px; display: block; overflow: visible; }
.at-svg-wrap svg text { font-family: var(--mono); font-size: 16px; fill: var(--muted); }
.at-axis { stroke: var(--control-border); stroke-width: 1.3; }
.at-grid { stroke: var(--divider); stroke-width: 1; }
.at-hull { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 4; fill: var(--soft); }
.at-point { fill: var(--accent); }
.at-context { fill: var(--target); stroke: var(--surface); stroke-width: 1; }
.at-trace { fill: none; stroke: var(--accent); stroke-width: 3; }
.at-trace-alt { stroke: var(--target); stroke-dasharray: 9 5; }
.at-checkboxes { display: flex; flex-wrap: wrap; gap: 1rem 1.7rem; margin: 1rem 0; }
.at-row-button { border: 1px solid var(--control-border); border-radius: .35rem; color: var(--ink); background: var(--surface); padding: .45rem .65rem; min-height: 40px; cursor: pointer; white-space: nowrap; font: inherit; }
.at-row-button[aria-pressed="true"] { color: var(--accent); background: var(--soft); border-color: var(--accent); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.at-heat-cell { font-family: var(--mono); text-align: center; color: var(--ink); min-width: 6rem; }
.at-selected-row > td { border-top: 2px solid var(--accent); border-bottom: 2px solid var(--accent); }
.app[data-projector="true"] .at-help { font-size: 1em; }
.app[data-projector="true"] .at-svg-wrap svg text { font-size: 18px; }
.app[data-projector="true"] .at-row-button { min-height: 48px; }
@media (max-width: 600px) {
  .at-weight { grid-template-columns: minmax(3.7rem, 1fr) minmax(4rem, 2fr) minmax(4rem, .7fr); gap: .55rem; }
  .at-checkboxes { flex-direction: column; gap: .75rem; }
  .at-svg-wrap { padding: .4rem; }
}
@media print {
  .at-svg-wrap { overflow: visible; break-inside: avoid; }
  .at-svg-wrap svg { min-width: 0; }
}
